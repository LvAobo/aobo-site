publications:
- title: "Closed-Form Gaussian Estimators for Multi-Source Partial Information Decomposition"
  publishedIn:
    name: arXiv preprint
    date: 2026
    url: https://arxiv.org/abs/2605.09919
  authors:
  - name: A. Lyu
  - name: A. Clark
  - name: N. Raviv
  paper:
    summary: We develop closed-form Gaussian estimators for multi-source PID, providing two-source redundancy, multi-source unique information, and K-th order synergistic effects. The estimators are derived from conditional-independence-based information measures and reduce to log-determinant expressions in covariance blocks.
    url: https://arxiv.org/abs/2605.09919
  categories: ["info-decomposition"]
  tags: ["PID", "Information Theory", "Gaussian Estimation"]

- title: "Structural Impossibility of Antichain-Lattice Partial Information Decomposition"
  publishedIn:
    name: arXiv preprint
    date: 2026
    url: https://arxiv.org/abs/2604.03869
  authors:
  - name: A. Lyu
  - name: A. Clark
  - name: N. Raviv
  paper:
    summary: This work establishes fundamental structural impossibility results for the antichain-lattice framework of Partial Information Decomposition.
    url: https://arxiv.org/abs/2604.03869
  categories: ["info-decomposition"]
  tags: ["PID", "Information Theory"]

- title: "Multivariate Partial Information Decomposition: Constructions, Inconsistencies, and Alternative Measures"
  publishedIn:
    name: Physical Review E
    date: March 2026
    url: https://journals.aps.org/pre/abstract/10.1103/8rzp-w5z1
  authors:
  - name: A. Lyu
  - name: A. Clark
  - name: N. Raviv
  paper:
    summary: We provide explicit closed-form formulas for all information atoms in the two-source case and prove that for three or more sources, PID suffers from fundamental inconsistencies. We propose alternative measures to address these issues.
    url: https://arxiv.org/abs/2508.05530
  categories: ["info-decomposition"]
  tags: ["PID", "Information Theory", "Multivariate Analysis"]

- title: "The Whole Is Less than the Sum of Parts: Subsystem Inconsistency in Partial Information Decomposition"
  publishedIn:
    name: arXiv preprint
    date: 2025
    url: https://arxiv.org/abs/2510.14864
  authors:
  - name: A. Lyu
  - name: A. Clark
  - name: N. Raviv
  paper:
    summary: This work identifies and analyzes the subsystem inconsistency problem in Partial Information Decomposition, showing that the whole can be less than the sum of its parts.
    url: https://arxiv.org/abs/2510.14864
  categories: ["info-decomposition"]
  tags: ["PID", "Information Theory"]

